<!DOCTYPE html>
<html lang="en" style="background: transparent !important;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPZ · Race UI</title>
    <style>
      html, body {
        background: transparent !important;
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body style="background: transparent !important;">
<!-- Hidden until the loading screen is down (client/boot.lua): NUI pages draw
     on top of the loading screen, so this page showed through it. -->
<style>body.spz-booting { visibility: hidden !important; }</style>
<script>
  document.body.classList.add('spz-booting')
  window.addEventListener('message', function (e) {
    if (e.data && e.data.action === 'spzBooted') document.body.classList.remove('spz-booting')
  })
</script>
    <div id="root" style="background: transparent !important;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
